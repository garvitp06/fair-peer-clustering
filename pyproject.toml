[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fairpeer"
version = "1.0.0"
description = "Fairness-aware clustering and reviewer assignment for peer evaluation systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["fairpeer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
